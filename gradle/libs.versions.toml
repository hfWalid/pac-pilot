# Single source of truth for dependency versions.
# No module build file may declare a version inline — see M0-01.
#
# This catalog lists only what is actually consumed. A pinned-but-unused entry is dead
# configuration: nothing builds against it, so nothing proves the version resolves or works.
# Entries arrive with the task that first needs them — kotlinx-datetime at M1-03.

[versions]
java = "21"
kotlin = "2.4.10"
springBoot = "3.5.16"
assertj = "3.27.7"
archunit = "1.5.0"
junit = "5.14.1"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# :core has no Spring BOM to manage JUnit for it, so the platform is pinned here.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# Versions come from the Spring Boot BOM imported in :server, so these stay version-less.
# flyway-database-postgresql is not optional: Flyway 10+ moved PostgreSQL support into its own
# module and fails at runtime without it.
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# The BOM carries versions for every spring-boot-* artifact below, so they stay version-less here.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
# M4 persistence. Supersedes the JDBC-only arrangement of M0-05, which existed so Flyway had a
# DataSource and nothing more; ADR-0008 keeps this out of the catalog until it is consumed.
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }

[plugins]
# Kotlin appears only as Multiplatform, for :core. :server is Java (ADR-0010), so the kotlin-jvm
# and kotlin-spring plugins are gone — they were consumed by nothing after the migration, and an
# unused entry is dead configuration (ADR-0008).
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
