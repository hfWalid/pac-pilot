# Single source of truth for dependency versions.
# No module build file may declare a version inline — see M0-01.
#
# This catalog lists only what is actually consumed. A pinned-but-unused entry is dead
# configuration: nothing builds against it, so nothing proves the version resolves or works.
# Entries arrive with the task that first needs them — ArchUnit at M0-06, Flyway and the
# Postgres driver at M0-05, kotlinx-datetime at M1-03.

[versions]
java = "21"
kotlin = "2.4.10"
springBoot = "3.5.16"
assertj = "3.27.7"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# The BOM carries versions for every spring-boot-* artifact below, so they stay version-less here.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
